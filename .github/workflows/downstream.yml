name: Downstream compatibility

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [langchain, mlflow, bandit]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Ensure Git 2.52 or newer
        run: |
          if ! dpkg --compare-versions "$(git version | awk '{print $3}')" ge 2.52; then
            sudo add-apt-repository --yes ppa:git-core/ppa
            sudo apt-get update
            sudo apt-get install --yes git
          fi
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.13'
          enable-cache: false
      - name: Test latest release against this checkout
        run: uv run test/downstream/run.py "${{ matrix.project }}"
